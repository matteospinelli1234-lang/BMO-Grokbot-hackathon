<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Operator Console</title>
<style>
 body{font-family:sans-serif;margin:20px;background:#111;color:#eee}
 .card{background:#222;padding:15px;margin:10px 0;border-radius:8px}
 button,select{padding:8px 16px;margin-right:8px;border:0;border-radius:6px;cursor:pointer}
 .yes{background:#2e7d32;color:#fff}.no{background:#c62828;color:#fff}
 img{max-width:300px;display:block;margin:8px 0}
 iframe{width:100%;height:600px;border:0;margin-top:20px}
</style></head><body>
<h1>Operator Console</h1>
<div id="status"></div>
<div class="card">
  <b>Manual command:</b>
  <select id="zone">
    <option>zone_A</option><option>zone_B</option><option>zone_C</option>
  </select>
  <button class="yes" onclick="go()">Go</button>
</div>
<h2>Pending decisions</h2><div id="pending">Loading...</div>
<iframe src="http://localhost:3000/d/drone-konsol?kiosk&refresh=5s"></iframe>
<script>
async function refresh(){
  const s = await (await fetch("/status")).json();
  document.getElementById("status").innerHTML = s.drone_busy
    ? `<b>Drone in the air:</b> ${s.mission.target_zone} | ${s.queue.length} task(s) in queue`
    : "<b>Drone idle</b>";
  const p = await (await fetch("/pending")).json();
  document.getElementById("pending").innerHTML = p.length ? p.map(t => `
    <div class="card">
      <b>${t.target_zone}</b><br>${t.changes_detected}<br><i>${t.reasoning}</i>
      ${t.photo ? `<img src="/frames/${t.photo}">` : ""}
      <button class="yes" onclick="decide('${t.task_id}','yes')">Yes, send drone</button>
      <button class="no" onclick="decide('${t.task_id}','no')">No, don't send</button>
    </div>`).join("") : "No pending tasks.";
}
async function decide(id, d){
  await fetch("/decision", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({task_id:id, decision:d})});
  refresh();
}
async function go(){
  await fetch("/command", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({target_zone: document.getElementById("zone").value})});
  refresh();
}
setInterval(refresh, 2000); refresh();
</script></body></html>
